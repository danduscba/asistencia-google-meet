<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="estilos.css">
  <script src="config.js"></script>
  <style>
    .canvas { width: 440px; height: 280px; }
    .content {
      position: absolute;
      inset: 0;
      padding: 0 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 0 0 2px rgb(255 255 255 / 35%); }
    /* El ancho máximo hace que el nombre se divida en "Asistencia para / Google Meet". */
    h1 { margin: 16px 0 8px; font-size: 29px; line-height: 1.1; letter-spacing: -0.01em; max-width: 250px; }
    p { margin: 0; font-size: 16px; line-height: 1.3; opacity: 0.9; max-width: 250px; }
    /* Ondas de voz decorativas. */
    .bars {
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .bars span { width: 12px; border-radius: 6px; background: rgb(255 255 255 / 28%); }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="bars">
      <span style="height:46px"></span><span style="height:96px"></span><span style="height:150px"></span>
      <span style="height:110px"></span><span style="height:60px"></span>
    </div>
    <div class="content">
      <img src="../icons/icon-128.png" alt="">
      <h1 data-app-name></h1>
      <p>Quién participa y cuánto habla cada uno</p>
    </div>
  </div>
</body>
</html>
